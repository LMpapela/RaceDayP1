name: RaceDay .NET CI

on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]

jobs:
build:

```
runs-on: ubuntu-latest

steps:
- name: Checkout repository
  uses: actions/checkout@v4

- name: Setup .NET
  uses: actions/setup-dotnet@v4
  with:
    dotnet-version: '8.0.x'

- name: Restore dependencies
  run: dotnet restore ./src/RaceDayP1/RaceDayP1.csproj

- name: Build project
  run: dotnet build ./src/RaceDayP1/RaceDayP1.csproj --no-restore --configuration Release
```
